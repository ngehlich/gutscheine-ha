add:
  fields:
    shop:
      required: true
      example: "Media Markt"
      selector:
        text:
    value:
      example: 30
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    balance:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    expires:
      selector:
        date:
    issued:
      selector:
        date:
    owner:
      example: "Nils"
      selector:
        text:
    code:
      selector:
        text:
    code_type:
      selector:
        select:
          translation_key: code_type
          options:
            - barcode
            - qr
            - text
    pin:
      selector:
        text:
    kind:
      example: "Gutschein"
      selector:
        text:
    note:
      selector:
        text:
          multiline: true

